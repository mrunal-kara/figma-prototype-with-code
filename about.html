<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/pages.css" rel="stylesheet">
  </head>
  <body>
    <main class="about-page">
      <section class="about-intro">
        <div class="about-copy">
          <h1 class="about-heading">About Us</h1>
          <div class="mission">
            <h2>Our Mission</h2>
            <p>PULSE connects curious people with unforgettable local experiences.</p>
            <p class="mission-prompt">Tap a vibe to preview what's happening tonight</p>
            <ul class="vibe-list list-unstyled mb-0" aria-label="Experience examples">
              <li class="vibe-button">Live concerts</li>
              <li class="vibe-button">Creative workshops</li>
              <li class="vibe-button">Tech &amp; AI meetups</li>
            </ul>
          </div>
        </div>
        <img class="about-image" src="assets/images/about2.jpg" alt="Blue-lit concert stage">
      </section>

      <section class="contact-section" aria-labelledby="contact-heading">
        <div class="contact-content">
          <h2 id="contact-heading">Contact Us</h2>
          <p>Any remarks or suggestions? Just write us a message!</p>
          <form class="contact-form">
            <label class="visually-hidden" for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" placeholder="Name :" autocomplete="name" required>
            <label class="visually-hidden" for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" placeholder="Email :" autocomplete="email" required>
            <button type="submit">Submit</button>
          </form>
        </div>
        <div class="contact-footer" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
